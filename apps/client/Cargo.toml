[package]
name = "precept-ui-client"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Operator app transport: native IPC to the daemon and the Windows -> WSL2 bridge"

[dependencies]
precept-ui-core = { path = "../core" }
precept-core = { path = "../../crates/precept-core" }
precept-ipc = { path = "../../crates/precept-ipc" }
precept-sync = { path = "../../crates/precept-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "process", "io-util", "io-std", "sync", "macros"] }
clap = { version = "4", features = ["derive"] }
nsh-updater = { git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6" }
ureq = { version = "~3.5.2", features = ["platform-verifier", "socks-proxy"] }
url = "2"
# settings.toml (the operator's settings).
toml = "1.2"

[[bin]]
name = "precept-bridge"
path = "src/bin/precept_bridge.rs"

[[bin]]
name = "precept-ui-snapshot"
path = "src/bin/precept_ui_snapshot.rs"

[dev-dependencies]
tempfile = "3"
