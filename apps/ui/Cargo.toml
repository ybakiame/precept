[package]
name = "acp-operator-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
ipc = ["dep:acp-operator-client"]
native = ["ipc", "dep:nsh-platform-linux", "dep:nsh-platform-macos", "dep:nsh-platform-windows"]
tui = ["ipc", "dep:nsh-platform-tui", "dep:ratatui-core", "dep:ratatui-crossterm", "dep:crossterm"]

[dependencies]
serde_json = "1"
acp-operator-core = { path = "../core" }
acp-operator-client = { path = "../client", optional = true }
# NSH 0.5-based upstream keyboard fix; owner-approved immutable revision.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }
nsh-platform-tui = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, features = ["run-app"], optional = true }
ratatui-core = { version = "=0.1.2", optional = true }
ratatui-crossterm = { version = "=0.1.2", optional = true }
crossterm = { version = "0.29", optional = true }

[target.'cfg(target_os="linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, optional = true }
[target.'cfg(target_os="macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, optional = true }
[target.'cfg(target_os="windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
nsh-platform-web = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt","net","time"] }
acp-ipc = { path = "../../crates/acp-ipc" }
tempfile = "3"
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }

[[bin]]
name = "acp-nsh-native"
path = "src/main.rs"
required-features = ["native"]
[[bin]]
name = "acp-nsh-tui"
path = "src/tui.rs"
required-features = ["tui"]
