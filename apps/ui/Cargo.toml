[package]
name = "precept-ui"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
ipc = []
native = ["ipc", "dep:nsh-platform-linux", "dep:nsh-platform-macos", "dep:nsh-platform-windows"]

[dependencies]
serde_json = "1"
precept-ui-core = { path = "../core" }
precept-ui-client = { path = "../client" }
# NSH v0.6.0, owner-approved immutable revision. 0.6.0 gates SVG rendering
# behind the platform crates' `svg` feature (default off here): the native
# platforms enable it, or every icon silently draws nothing.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, features = ["editor", "highlight", "rich-editor"] }

[target.'cfg(target_os="linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, features = ["svg"], optional = true }
[target.'cfg(target_os="macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, features = ["svg"], optional = true }
[target.'cfg(target_os="windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false, features = ["svg"], optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["rt","net","time"] }
precept-ipc = { path = "../../crates/precept-ipc" }
precept-core = { path = "../../crates/precept-core" }
tempfile = "3"
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "554163758e30d2f62f814096a6327937dcb4fe49", default-features = false }

[[bin]]
name = "precept-desktop"
path = "src/main.rs"
required-features = ["native"]
