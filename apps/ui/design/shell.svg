<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Window shell blueprint</title>
  <desc id="d">The operator window: a themed title bar, a 232-point sidebar with brand, three destination groups and a live status row, and a page with header, toolbar and one scroll region. A toast floats in at the bottom-right over the content, in the overlay layer; it never pushes the page.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="960" height="600" rx="14" fill="#111113"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- title bar -->
    <rect x="0" y="0" width="960" height="36" rx="14" fill="#161618"/>
    <rect x="0" y="22" width="960" height="14" fill="#161618"/>
    <g stroke="#a3a3ad" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M836 18h12"/><rect x="878" y="12" width="11" height="11"/><path d="M920 12l11 11M931 12l-11 11"/>
    </g>
    <!-- sidebar -->
    <rect x="0" y="36" width="232" height="564" fill="#161618"/>
    <path d="M232 36V600" stroke="#2c2c33"/>
    <g transform="translate(16 52) scale(1)" fill="none" stroke="#b4bcff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3L21 7.5L12 12L3 7.5Z"/><path d="M3 12L12 16.5L21 12" stroke="#a3a3ad"/><path d="M3 16.5L12 21L21 16.5" stroke="#75757f"/>
    </g>
    <text x="48" y="69" font-size="14" font-weight="600" fill="#ededf0">Agent Control Plane</text>
    <g font-size="11" font-weight="600" fill="#75757f">
      <text x="20" y="108">SET UP</text><text x="20" y="252">PROJECT</text><text x="20" y="408">PERSONAL</text>
    </g>
    <g font-size="13" fill="#a3a3ad">
      <text x="44" y="134">Connection</text><text x="44" y="162">Profile</text><text x="44" y="190">Workspaces</text><text x="44" y="218">Agents</text>
      <text x="44" y="320">Dashboard</text><text x="44" y="376">Handoff</text><text x="44" y="432" fill="#a3a3ad">Personal preferences</text><text x="44" y="460">To review</text>
    </g>
    <g fill="#8fdcae"><circle cx="212" cy="130" r="3"/><circle cx="212" cy="158" r="3"/><circle cx="212" cy="186" r="3"/></g>
    <circle cx="212" cy="214" r="3" fill="none" stroke="#75757f"/>
    <rect x="16" y="264" width="200" height="28" rx="6" fill="#1b1b1f" stroke="#2c2c33"/>
    <text x="28" y="283" font-size="13" fill="#ededf0">lanpath</text><path d="M196 276l4 4 4-4" stroke="#a3a3ad" fill="none" stroke-width="1.4"/>
    <!-- sliding selection -->
    <rect x="12" y="330" width="208" height="28" rx="6" fill="#29292f"/>
    <text x="44" y="348" font-size="13" fill="#ededf0">Preferences</text>
    
    <rect x="16" y="552" width="200" height="30" rx="6" fill="#1b1b1f" stroke="#2c2c33"/>
    <circle cx="32" cy="567" r="4" fill="#8fdcae"/>
    <circle cx="32" cy="567" r="4" fill="none" stroke="#8fdcae" stroke-width="1.5"><animate attributeName="r" values="4;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="46" y="571.5" font-size="12" fill="#ededf0">Connected</text><text x="114" y="571.5" font-size="12" fill="#a3a3ad">· WSL archlinux</text>
    <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(20 120) scale(.6667)" stroke="#a3a3ad" d="M9 15L15 9M10 6L12 4A4 4 0 0 1 20 12L18 14M14 18L12 20A4 4 0 0 1 4 12L6 10"/><path transform="translate(20 148) scale(.6667)" stroke="#a3a3ad" d="M4 5H20V19H4ZM9 10A2 2 0 1 0 9.01 10M6.5 16C7 14 11 14 11.5 16M14 10H18M14 14H17"/><path transform="translate(20 176) scale(.6667)" stroke="#a3a3ad" d="M3 6H10L12 9H21V20H3Z"/><path transform="translate(20 204) scale(.6667)" stroke="#a3a3ad" d="M9 3V8M15 3V8M6 8H18V12A6 6 0 0 1 6 12ZM12 18V21"/><path transform="translate(20 306) scale(.6667)" stroke="#a3a3ad" d="M3 3H10V10H3ZM14 3H21V10H14ZM3 14H10V21H3ZM14 14H21V21H14Z"/><path transform="translate(20 334) scale(.6667)" stroke="#ededf0" d="M4 6H20M4 12H20M4 18H20M8 3V9M16 9V15M10 15V21"/><path transform="translate(20 362) scale(.6667)" stroke="#a3a3ad" d="M4 4H14V20H4ZM9 9H21M17 5L21 9L17 13"/><path transform="translate(20 418) scale(.6667)" stroke="#a3a3ad" d="M12 12A4 4 0 1 0 12 4A4 4 0 1 0 12 12M4 21C5 16 19 16 20 21"/><path transform="translate(20 446) scale(.6667)" stroke="#a3a3ad" d="M3 13H8L10 16H14L16 13H21M5 6H19L21 13V19H3V6Z"/></g>
    <!-- page -->
    <text x="256" y="72" font-size="12" fill="#75757f">lanpath  /</text>
    <text x="256" y="100" font-size="22" font-weight="600" fill="#ededf0">Preferences</text>
    <text x="256" y="122" font-size="12" fill="#a3a3ad">Confirmed rules agents receive for this project · read 14:14</text>
    <rect x="796" y="80" width="140" height="28" rx="6" fill="#29292f" stroke="#2c2c33"/>
    <text x="834" y="99" font-size="13" fill="#ededf0">Add preference…</text>
    <path d="M812 94h10M817 89v10" stroke="#ededf0" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="256" y="148" width="680" height="400" rx="10" fill="#1b1b1f" stroke="#2c2c33"/>
    <g font-size="13">
      <g fill="#ededf0"><text x="276" y="178">commit-style</text><text x="276" y="226">test-before-push</text><text x="276" y="274">no-force-push</text><text x="276" y="322">rust-edition</text></g>
      <g fill="#a3a3ad"><text x="440" y="178">Conventional commits; imperative subject…</text><text x="440" y="226">Run the workspace tests before any push.</text><text x="440" y="274">Never force-push shared branches.</text><text x="440" y="322">Edition 2024 for every crate.</text></g>
      <g stroke="#2c2c33"><path d="M256 196h680M256 244h680M256 292h680M256 340h680"/></g>
    </g>
    <g font-size="11" font-weight="600">
      <rect x="846" y="166" width="70" height="18" rx="4" fill="#8fdcae" fill-opacity=".14"/><text x="855" y="179" fill="#8fdcae">Confirmed</text>
      <rect x="846" y="214" width="70" height="18" rx="4" fill="#8fdcae" fill-opacity=".14"/><text x="855" y="227" fill="#8fdcae">Confirmed</text>
      <rect x="846" y="262" width="70" height="18" rx="4" fill="#f2c46d" fill-opacity=".16"/><text x="853" y="275" fill="#f2c46d">Suggested</text>
      <rect x="846" y="310" width="70" height="18" rx="4" fill="#8fdcae" fill-opacity=".14"/><text x="855" y="323" fill="#8fdcae">Confirmed</text>
    </g>
    <!-- toast, overlay layer -->
    <g filter="url(#sh)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 0;0 0;0 0;0 24" keyTimes="0;.12;.7;.8;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1;0 0 1 1;0 0 1 1;.4 0 1 1"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.12;.7;.8;1" dur="5s" repeatCount="indefinite"/>
        <rect x="576" y="508" width="360" height="56" rx="12" fill="#222227" stroke="#2c2c33"/>
        <circle cx="604" cy="536" r="12" fill="#8fdcae" fill-opacity=".16"/>
        <path d="M598.5 536.5l3.5 3.5 7-7" stroke="#8fdcae" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="626" y="541" font-size="13" fill="#ededf0">Saved as a suggestion · review it next</text>
        <path d="M912 530l10 10M922 530l-10 10" stroke="#a3a3ad" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <!-- annotations -->
    <g font-size="11" fill="#b4bcff">
      <path d="M232 590h-0" />
      <text x="244" y="590">sidebar 232 · page inset 24 · one scroll region · toasts float in the overlay layer, bottom-right, 16 from the edges</text>
    </g>
  </g>
</svg>
