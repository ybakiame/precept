<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-labelledby="t d">
  <title id="t">Connection status, live and at rest</title>
  <desc id="d">Left: the sidebar status row while the daemon answers; a ring breathes out from the dot every 2.4 seconds. Middle: reading; the dot dims and brightens. Right: unreachable; the dot is still and the words carry the state.</desc>
  <rect width="560" height="120" rx="12" fill="#161618"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <g transform="translate(24 46)">
      <rect width="160" height="30" rx="6" fill="#1b1b1f" stroke="#2c2c33"/>
      <circle cx="16" cy="15" r="4" fill="#8fdcae"/>
      <circle cx="16" cy="15" r="4" fill="none" stroke="#8fdcae" stroke-width="1.5">
        <animate attributeName="r" values="4;10" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1"/>
        <animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="19.5" fill="#ededf0">Connected</text>
      <text x="100" y="19.5" fill="#a3a3ad">· WSL</text>
    </g>
    <g transform="translate(200 46)">
      <rect width="160" height="30" rx="6" fill="#1b1b1f" stroke="#2c2c33"/>
      <circle cx="16" cy="15" r="4" fill="#f2c46d">
        <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="19.5" fill="#ededf0">Reading…</text>
    </g>
    <g transform="translate(376 46)">
      <rect width="160" height="30" rx="6" fill="#1b1b1f" stroke="#2c2c33"/>
      <circle cx="16" cy="15" r="4" fill="none" stroke="#ff9d9d" stroke-width="1.6"/>
      <text x="30" y="19.5" fill="#ff9d9d">Unreachable</text>
    </g>
    <g fill="#75757f" font-size="11">
      <text x="24" y="30">live · ping 2.4s, paused when reduced</text>
      <text x="200" y="30">loading · breathe 1.2s</text>
      <text x="376" y="30">error · still, hollow dot</text>
    </g>
  </g>
</svg>
