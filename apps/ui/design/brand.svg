<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-labelledby="t d">
  <title id="t">Agent Control Plane</title>
  <desc id="d">The ACP mark: three stacked planes with a context node. A signal travels from the top plane to the bottom one, the way context reaches an agent.</desc>
  <rect width="720" height="180" rx="16" fill="#111113"/>
  <g transform="translate(48 30) scale(5)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
    <path d="M12 3L21 7.5L12 12L3 7.5Z" stroke="#b4bcff">
      <animate attributeName="stroke-opacity" values="1;1;.45;1" keyTimes="0;.3;.6;1" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M3 12L12 16.5L21 12" stroke="#a3a3ad">
      <animate attributeName="stroke" values="#a3a3ad;#b4bcff;#a3a3ad" keyTimes="0;.45;.75" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M3 16.5L12 21L21 16.5" stroke="#75757f">
      <animate attributeName="stroke" values="#75757f;#75757f;#8fdcae;#75757f" keyTimes="0;.55;.75;1" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="12" cy="7.5" r="1.5" fill="#b4bcff" stroke="none">
      <animate attributeName="cy" values="7.5;7.5;16.5;21;21" keyTimes="0;.2;.55;.72;1" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.22 1 .36 1;.22 1 .36 1;0 0 1 1"/>
      <animate attributeName="fill" values="#b4bcff;#b4bcff;#8fdcae;#8fdcae" keyTimes="0;.55;.72;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.6;.72;.8;.95;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="196" y="86" font-size="34" font-weight="600" fill="#ededf0">Agent Control Plane</text>
    <text x="198" y="120" font-size="17" fill="#a3a3ad">The right context, for the right agent, with a reason.</text>
  </g>
</svg>
