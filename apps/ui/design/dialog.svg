<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">Dialog anatomy, sizes and entrance</title>
  <desc id="d">Left: the Add preference dialog at the medium size, 520 points wide; every labeled field fills the panel's content width, so nothing reaches past its edge. The scrim fades in on fast while the panel rises 8 points from 0.97 scale on slow. Right: the three dialog widths.</desc>
  <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter></defs>
  <rect width="900" height="460" rx="14" fill="#111113"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="0" y="0" width="600" height="460" rx="14" fill="#000">
      <animate attributeName="fill-opacity" values="0;.5;.5;.5;0" keyTimes="0;.06;.8;.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g filter="url(#sh)">
      <animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0;0 4;0 8" keyTimes="0;.1;.8;.86;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1;0 0 1 1;.4 0 1 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.1;.8;.86;1" dur="5s" repeatCount="indefinite"/>
      <rect x="40" y="36" width="520" height="388" rx="12" fill="#222227" stroke="#2c2c33"/>
      <circle cx="76" cy="72" r="14" fill="#b4bcff" fill-opacity=".14"/>
      <path d="M70 72h12M76 66v12" stroke="#b4bcff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="100" y="70" font-size="16" font-weight="600" fill="#ededf0">Add a personal preference</text>
      <text x="100" y="90" font-size="12" fill="#a3a3ad">Saved as a suggestion. You confirm the exact record before agents receive it.</text>
      <g font-size="12" font-weight="500" fill="#ededf0"><text x="64" y="130">Key</text><text x="64" y="196">Value</text><text x="64" y="324">Source</text></g>
      <rect x="64" y="138" width="472" height="32" rx="6" fill="#1b1b1f" stroke="#75757f"/>
      <text x="76" y="159" font-size="13" fill="#ededf0">commit-style</text>
      <rect x="64" y="204" width="472" height="96" rx="6" fill="#1b1b1f" stroke="#b4bcff"/>
      <rect x="62" y="202" width="476" height="100" rx="8" fill="none" stroke="#b4bcff" stroke-opacity=".35" stroke-width="2"/>
      <text x="76" y="226" font-size="13" fill="#ededf0">Use <tspan font-weight="700">conventional commits</tspan>; imperative subject.</text>
      <rect x="64" y="332" width="472" height="32" rx="6" fill="#1b1b1f" stroke="#75757f"/>
      <text x="76" y="353" font-size="13" fill="#ededf0">operator</text>
      <path d="M40 380h520" stroke="#2c2c33"/>
      <rect x="300" y="388" width="76" height="28" rx="6" fill="#29292f" stroke="#2c2c33"/><text x="318" y="407" font-size="13" fill="#ededf0">Cancel</text>
      <rect x="384" y="388" width="152" height="28" rx="6" fill="#b4bcff"/><text x="402" y="407" font-size="13" font-weight="600" fill="#1b1d48">Save as suggestion</text>
    </g>
    <g font-size="11" fill="#b4bcff">
      <path d="M64 440h472" stroke="#b4bcff" stroke-dasharray="3 3"/><text x="250" y="454">content width = panel − 2 × 24</text>
    </g>
    <g transform="translate(628 40)" font-size="12">
      <text y="0" font-weight="600" fill="#ededf0">Widths</text>
      <rect y="18" width="150" height="34" rx="10" fill="#222227" stroke="#2c2c33"/><text x="12" y="39" fill="#ededf0">S · 400 <tspan fill="#a3a3ad">confirm</tspan></text>
      <rect y="62" width="195" height="34" rx="10" fill="#222227" stroke="#2c2c33"/><text x="12" y="83" fill="#ededf0">M · 520 <tspan fill="#a3a3ad">short form</tspan></text>
      <rect y="106" width="240" height="34" rx="10" fill="#222227" stroke="#2c2c33"/><text x="12" y="127" fill="#ededf0">L · 640 <tspan fill="#a3a3ad">rich value</tspan></text>
      <text y="176" fill="#a3a3ad">Panel: w-full, max-w = size;</text>
      <text y="194" fill="#a3a3ad">the editor yields height (96–320).</text>
      <text y="222" fill="#a3a3ad">Enter: scrim fast · panel slow,</text>
      <text y="240" fill="#a3a3ad">rise 8, scale .97 → 1, ease-out.</text>
      <text y="258" fill="#a3a3ad">Leave: base, ease-in, no overshoot.</text>
    </g>
  </g>
</svg>
