<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">Control motion specimens</title>
  <desc id="d">Three specimens on a loop. Press: a hover wash, then a press to 0.97 on the soft settle. Selection: one fill slides between segments. Done check: when a set-up step completes, its check pops in from a quarter of its size on base.</desc>
  <rect width="900" height="260" rx="14" fill="#111113"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g font-size="12" fill="#a3a3ad"><text x="40" y="40">Hover → press</text><text x="330" y="40">One selection, sliding</text><text x="650" y="40">Done check</text></g>
    <g font-size="11" fill="#75757f"><text x="40" y="220">wash + press fast · settle · scale .97</text><text x="330" y="220">one indicator · ease-in-out</text><text x="650" y="220">base · scale .25 → 1 + fade</text></g>
    <!-- press -->
    <g transform="translate(110 120)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;.97;1;1" keyTimes="0;.4;.5;.65;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.22 1 .36 1;.22 1 .36 1;0 0 1 1"/>
        <rect x="-70" y="-16" width="140" height="32" rx="6" fill="#29292f" stroke="#2c2c33">
          <animate attributeName="fill" values="#29292f;#323239;#3a3a42;#323239;#29292f" keyTimes="0;.2;.5;.7;1" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <path d="M-50 0a8 8 0 1 1 2.3 5.7M-42 -8v4h-4" stroke="#ededf0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-6 0)"/>
        <text x="-22" y="5" font-size="13" fill="#ededf0">Reconnect</text>
      </g>
      <path d="M40 30l6 16 3-6 6 6 3-3-6-6 6-3z" fill="#ededf0" stroke="#111113">
        <animateTransform attributeName="transform" type="translate" values="30 20;0 0;0 0;30 20" keyTimes="0;.25;.75;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- selection -->
    <g transform="translate(330 100)">
      <rect width="260" height="36" rx="8" fill="#1b1b1f" stroke="#2c2c33"/>
      <rect x="3" y="3" width="82" height="30" rx="6" fill="#29292f">
        <animate attributeName="x" values="3;3;89;89;175;175;3" keyTimes="0;.15;.3;.48;.63;.85;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1"/>
      </rect>
      <g font-size="13" fill="#ededf0" text-anchor="middle"><text x="44" y="23">System</text><text x="130" y="23">Light</text><text x="216" y="23">Dark</text></g>
    </g>
    <!-- done check -->
    <g transform="translate(650 100)">
      <rect width="210" height="34" rx="6" fill="#29292f"/>
      <g fill="none" stroke="#ededf0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(12 9) scale(.6667)"><path d="M4 5H20V19H4ZM9 10A2 2 0 1 0 9.01 10M6.5 16C7 14 11 14 11.5 16M14 10H18M14 14H17"/></g>
      <text x="40" y="22" font-size="13" fill="#ededf0">Profile</text>
      <g transform="translate(188 17)">
        <g opacity="1">
          <animateTransform attributeName="transform" type="scale" values=".25;.25;1;1;.25" keyTimes="0;.3;.42;.9;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.22 1 .36 1;0 0 1 1;0 0 1 1"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.42;.9;1" dur="3s" repeatCount="indefinite"/>
          <path d="M-5 0.5l3.3 3.3 6.7-6.7" stroke="#8fdcae" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
