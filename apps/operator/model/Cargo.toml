[package]
name = "acp-operator-model"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
native = ["dep:acp-ipc", "dep:tokio", "dep:clap"]

[dependencies]
acp-core = { path = "../../../crates/acp-core" }
acp-session = { path = "../../../crates/acp-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
acp-ipc = { path = "../../../crates/acp-ipc", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "process", "io-util"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "acp-ui-snapshot"
path = "src/snapshot.rs"
required-features = ["native"]
