[package]
name = "acp-ui-spike-model"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
native = ["dep:acp-ipc", "dep:tokio", "dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
acp-ipc = { path = "../../../crates/acp-ipc", optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "acp-ui-snapshot"
path = "src/snapshot.rs"
required-features = ["native"]
