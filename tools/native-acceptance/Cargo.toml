[package]
name = "precept-native-acceptance"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
name = "precept_native_acceptance"
path = "src/lib.rs"
[[bin]]
name = "precept-native-acceptance"
path = "src/main.rs"
[[bin]]
name = "precept-fake-desktop-worker"
path = "src/bin/fake_desktop_worker.rs"
[dependencies]
toml = "1.2"
precept-ipc = { path = "../../crates/precept-ipc" }
precept-core = { path = "../../crates/precept-core" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Pipes"] }

[[bin]]
name = "precept-portable-smoke"
path = "src/bin/portable_smoke.rs"

[[bin]]
name = "precept-linux-portable-smoke"
path = "src/bin/linux_portable_smoke.rs"
