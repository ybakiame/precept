name: Pull request gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  root:
    name: Root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Source contracts
        run: |
          npm ci --prefix tools
          node tools/check_source.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked

  apps:
    name: Operator app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libgtk-4-dev libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - name: Format
        run: cargo fmt --manifest-path apps/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked
