name: Pull request gates

on:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: Run macOS ARM64 headless checks
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  root:
    name: Root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: root
          cache-all-crates: true
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Source contracts
        run: |
          npm ci --prefix tools
          node tools/check_source.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked

  apps:
    name: Operator app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apps
          cache-all-crates: true
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libgtk-4-dev libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - name: Format
        run: cargo fmt --manifest-path apps/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked

  macos-arm64:
    name: macOS ARM64 headless
    if: github.event_name == 'pull_request' || inputs.macos_arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
          cache-all-crates: true
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustup target add aarch64-apple-darwin
      - name: Root check
        run: cargo check --workspace --all-targets --locked --target aarch64-apple-darwin
      - name: Operator app check
        run: cargo check --manifest-path apps/Cargo.toml --workspace --all-targets --locked --target aarch64-apple-darwin
