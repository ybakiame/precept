name: Rust native gates
on:
  push:
  pull_request:
jobs:
  core:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --bins --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Independent native daemon CLI IPC MCP and storage regressions
        run: cargo test --workspace --all-targets --locked
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools
      - run: node tools/check_source.mjs
