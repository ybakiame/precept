name: Rust core parity
on:
  push:
  pull_request:
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked --example contract_reader
      - run: cargo build --locked -p acp-store --example sqlite_reader
      - name: Python regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Cross-language parity (Unix)
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: src
        run: python tools/check_p1_parity.py
      - name: Cross-language parity (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: python tools/check_p1_parity.py --reader target/debug/examples/contract_reader.exe
      - name: SQLite parity (Unix)
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: src
        run: python tools/check_sqlite_parity.py
      - name: SQLite parity (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: python tools/check_sqlite_parity.py --reader target/debug/examples/sqlite_reader.exe
      - name: Synthetic-only migration and Python v1 compatibility
        run: cargo run --locked -p acp-rehearsal --example synthetic_rehearsal -- --synthetic-only
  process-recovery:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Real child termination and fresh-process recovery
        run: cargo test --locked -p acp-rehearsal --features recovery-tests --test process_recovery -- --nocapture
