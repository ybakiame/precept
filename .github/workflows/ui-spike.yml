name: NSH native and offline Web gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'tools/**'
      - '.github/workflows/ui-spike.yml'
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/Cargo.lock') }}
      - name: Linux NSH build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libgtk-4-dev libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup show
      - run: cargo build --workspace --bins --locked
      - run: cargo fmt --manifest-path apps/Cargo.toml --all -- --check
      - run: cargo build --manifest-path apps/Cargo.toml --workspace --features acp-operator-ui/native,acp-operator-ui/tui --bins --locked
      - run: cargo clippy --manifest-path apps/Cargo.toml --workspace --all-targets --features acp-operator-ui/native,acp-operator-ui/tui --locked -- -D warnings
      - name: Shared NSH headless components and real native daemon integration (not GUI or TTY evidence)
        run: cargo test --manifest-path apps/Cargo.toml --workspace --all-targets --features acp-operator-ui/native,acp-operator-ui/tui --locked
  web:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix apps/web-smoke
      - name: Verify Cargo, packager and workflow NSH pins before building
        run: node tools/check_source.mjs
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --manifest-path apps/ui/Cargo.toml --target wasm32-unknown-unknown --lib --locked
      - name: Fetch exact upstream renderer
        run: |
          git clone https://github.com/longbridge/nsh apps/vendor/nsh
          git -C apps/vendor/nsh checkout 554163758e30d2f62f814096a6327937dcb4fe49
      - run: node tools/package_ui_web.mjs apps/vendor/nsh apps/target/wasm32-unknown-unknown/debug/acp_operator_ui.wasm apps/ui/dist
      - run: node --test apps/web-smoke/static-server.test.mjs
      - run: npx --prefix apps/web-smoke playwright install chromium --with-deps
      - run: node apps/web-smoke/web-smoke.mjs apps/ui/dist apps/artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsh-offline-web
          path: apps/artifacts
