name: NSH native and offline Web gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/operator/**'
      - 'crates/**'
      - 'tools/**'
      - '.github/workflows/ui-spike.yml'
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/operator/Cargo.lock') }}
      - name: Linux NSH build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libgtk-4-dev libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup show
      - run: cargo build --workspace --bins --locked
      - run: cargo fmt --manifest-path apps/operator/model/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/operator/model/Cargo.toml --all-targets --features native --locked -- -D warnings
      - run: cargo test --manifest-path apps/operator/model/Cargo.toml --features native --locked
      - run: cargo fmt --manifest-path apps/operator/ui/Cargo.toml -- --check
      - run: cargo build --manifest-path apps/operator/ui/Cargo.toml --features native,tui --bins --locked
      - run: cargo clippy --manifest-path apps/operator/ui/Cargo.toml --all-targets --features native,tui --locked -- -D warnings
      - name: Shared NSH headless components and real native daemon integration (not GUI or TTY evidence)
        run: cargo test --manifest-path apps/operator/ui/Cargo.toml --all-targets --features native,tui --locked
  web:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --manifest-path apps/operator/ui/Cargo.toml --target wasm32-unknown-unknown --lib --locked
      - name: Fetch exact upstream renderer
        run: |
          git clone https://github.com/longbridge/nsh apps/operator/vendor/nsh
          git -C apps/operator/vendor/nsh checkout 87c7e8da85d2f15a56107baa6f0fabb419b508b3
      - run: node tools/package_ui_web.mjs apps/operator/vendor/nsh apps/operator/target/wasm32-unknown-unknown/debug/acp_operator_ui.wasm apps/operator/ui/dist
      - run: npm ci --prefix apps/operator/tests
      - run: node --test apps/operator/tests/static-server.test.mjs
      - run: npx --prefix apps/operator/tests playwright install chromium --with-deps
      - run: node apps/operator/tests/web-smoke.mjs apps/operator/ui/dist apps/operator/artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsh-offline-web
          path: apps/operator/artifacts
