name: NSH native gates
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'tools/**'
      - '.github/workflows/ui-spike.yml'
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/Cargo.lock') }}
      - name: Linux NSH build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libgtk-4-dev libasound2-dev libssl-dev libxkbcommon-dev libwayland-dev
      - run: rustup show
      - run: cargo build --workspace --bins --locked
      - run: cargo fmt --manifest-path apps/Cargo.toml --all -- --check
      - run: cargo build --manifest-path apps/Cargo.toml --workspace --features precept-ui/native --bins --locked
      - run: cargo clippy --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked -- -D warnings
      - name: Shared NSH headless components and real native daemon integration (not GUI or TTY evidence)
        run: cargo test --manifest-path apps/Cargo.toml --workspace --all-targets --features precept-ui/native --locked
