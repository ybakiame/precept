[package]
name = "acp-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Read-only SQLite adapter for existing Agent Control Plane P0 records"

[dependencies]
acp-core = { path = "../acp-core" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
