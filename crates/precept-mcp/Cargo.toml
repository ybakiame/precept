[package]
name = "precept-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync", "macros"] }
precept-ipc = { path = "../precept-ipc" }
precept-core = { path = "../precept-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
precept-store = { path = "../precept-store" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[[bin]]
name = "precept-mcp"
path = "src/main.rs"

[[bin]]
name = "precept-hook"
path = "src/hook.rs"
