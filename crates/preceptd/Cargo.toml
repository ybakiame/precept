[package]
name = "preceptd"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync", "macros", "process"] }
precept-ipc = { path = "../precept-ipc" }
clap = { version = "4", features = ["derive"] }
precept-core = { path = "../precept-core" }
precept-sync = { path = "../precept-sync" }
precept-store = { path = "../precept-store" }
precept-write = { path = "../precept-write", features = ["daemon-owner"] }
toml = "1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
[dev-dependencies]
tempfile = "3"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "0.10"

