[package]
name = "acp-write"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Isolated synthetic-only profile v2 writer; no profile adoption or production entrypoint"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
tempfile = "3"

[dev-dependencies]
acp-store = { path = "../acp-store" }
