[package]
name = "acp-rehearsal"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Owned temporary synthetic-only SQLite migration rehearsal; not a production migrator"

[dependencies]
acp-store = { path = "../acp-store" }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
tempfile = "3"

[features]
recovery-tests = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:hmac", "dep:getrandom"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.hmac]
version = "0.12"
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "acp-recovery-test-worker"
path = "src/bin/recovery_worker.rs"
required-features = ["recovery-tests"]

[[test]]
name = "process_recovery"
path = "tests/process_recovery.rs"
required-features = ["recovery-tests"]
