[package]
name = "acp-rehearsal"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Owned temporary synthetic-only SQLite migration rehearsal; not a production migrator"

[dependencies]
acp-store = { path = "../acp-store" }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
