[package]
name = "precept-store"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Strict read-only Rust-native Profile v1 adapter"

[dependencies]
precept-core = { path = "../precept-core" }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
precept-ipc = { path = "../precept-ipc" }
