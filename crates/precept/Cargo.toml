[package]
name = "precept"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync", "macros"] }
precept-ipc = { path = "../precept-ipc" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
